[package]
name = "desk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desk — every agent you work with, in one window"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
desk-core = { workspace = true }
desk-tuple = { path = "../crates/desk-tuple" }
desk-voice = { path = "../crates/desk-voice" }
tokio = { workspace = true }
eyre = { workspace = true }
notify = "8.2.1"
plist = "1.10.3"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
