[package]
name = "desk"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Desk — every agent you work with, in one window"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
bytes = "1.12.1"
desk-core = { workspace = true }
desk-tuple = { path = "../crates/desk-tuple" }
desk-voice = { path = "../crates/desk-voice" }
desk-wsl = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
fontdb = "0.24.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
notify = "8.2.1"
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tauri-plugin-http = "2.8.3"
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
plist = "1.10.3"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
xattr = "1.6.1"
