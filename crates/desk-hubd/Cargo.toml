[package]
name = "desk-hubd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keeps Desk's local workforce hub running: Postgres, config, secrets, restarts"

[dependencies]
desk-core = { workspace = true }
eyre = { workspace = true }
postgresql_embedded = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25.17"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
