[package]
name = "desk-hubd"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Keeps Desk's local workforce hub running: Postgres, config, secrets, restarts"

# Only on macOS and Linux: on Windows Desk runs the Linux build inside WSL,
# and this crate is a stub that says so.
[target.'cfg(unix)'.dependencies]
desk-core = { workspace = true }
eyre = { workspace = true }
libc = { workspace = true }
postgresql_embedded = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25.17"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = "3.5.0"

[dev-dependencies]
tempfile = { workspace = true }
