[package]
name = "desk-machine"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Desk on a machine of the person's own: reaching its backend with their ssh, the forward to its hub, and adding it"

# A stand-in for ssh that answers from a scenario file and forwards a port
# as `ssh -L` does, for the tests.
[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"
test = false

# Desk's askpass as a program, for the tests (Desk itself is the askpass).
[[bin]]
name = "desk-askpass"
path = "src/bin/desk-askpass.rs"
test = false

# The add flow's native steps as a command, for the live check against a
# real machine (designs §12; built for macOS by machine-live.yml).
[[bin]]
name = "machine-live"
path = "src/bin/machine-live.rs"
test = false

[dependencies]
desk-core = { workspace = true }
eyre = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
socket2 = { version = "0.6", features = ["all"] }
tempfile = { workspace = true }
tracing = { workspace = true }
url = "2.5"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
