[package]
name = "desk-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desk's voice: wake by name, push-to-talk, on-device speech in and out"

[dependencies]
base64 = { workspace = true }
bzip2 = "0.6.1"
desk-core = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }
sha2 = "0.11.1"
sherpa-onnx = "2.0.1"
serde_json = { workspace = true }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "pcm", "wav"] }
tar = { version = "0.4.46", default-features = false }
tracing = { workspace = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1.26"
ureq = "3.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-avf-audio = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = { workspace = true }
