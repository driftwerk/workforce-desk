[package]
name = "desk-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "What the Desk app and its hub supervisor share: where things live, secrets, and reaching the backend"

[dependencies]
base64 = { workspace = true }
dirs = { workspace = true }
eyre = { workspace = true }
keyring = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
whoami = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# What the app installs before it makes a client, when a workspace build
# gives reqwest rustls without a provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = { workspace = true }
tokio = { workspace = true }
