[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
desk-core = { path = "crates/desk-core" }
desk-wsl = { path = "crates/desk-wsl" }
dirs = "7.0.0"
eyre = "0.6.14"
keyring = "4.2.0"
libc = "0.2.191"
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["bundled", "tokio", "tls-rustls-ring"] }
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
