[env]
# The Postgres that postgresql_embedded bundles into desk-hubd, so a first
# launch installs it from the binary with no network. Keep it on major 18:
# a different major can't open the data directories Desk already made.
POSTGRESQL_VERSION = "=18.6.1"

# The speech libraries (sherpa-onnx) for Windows are built against the
# static C runtime; the rest of Desk links it the same way.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo run` (and so `npm run tauri dev`) on macOS goes through
# scripts/dev-run.sh, which signs Desk's binaries with
# DESK_DEV_SIGNING_IDENTITY when it's set (README → Develop → Keychain), so
# the keychain's "Always Allow" outlives a rebuild. Unset, it only runs them.
[target.'cfg(target_os = "macos")']
runner = "scripts/dev-run.sh"
