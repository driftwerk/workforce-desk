name: Nightly

# Each night at about 01:30 UTC, a build of Desk's main for the Desks set to
# Updates: Nightly (Settings → Help); no one on Stable gets it. It skips a
# night when nothing changed since the last nightly (no new commits on main,
# no newer hub), while a stable release is running, or when Desk's CI hasn't
# passed at the exact commit it would build. When the hub (driftwerk/workforce
# main) has a newer commit whose checks passed, it commits that to hub.ref
# first, once Desk's CI passes with it. It builds through release.yml, with
# channel nightly: a pre-release v<version> that is never the latest, and
# latest-nightly.json on the `nightly` release. A failed night opens an
# issue (label nightly), which the next good night closes. See
# docs/RELEASING.md, "Nightly".

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything but publish: no commit to main, no release, no feed"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  plan:
    name: Plan tonight's nightly
    runs-on: ubuntu-latest
    # Waiting for Desk's CI (three hours at most, all told) included.
    timeout-minutes: 240
    permissions:
      # The hub.ref bump: its branch, and main fast-forwarded to it.
      contents: write
      # Desk's CI run on that branch (a push with this token starts none).
      actions: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      hub_ref: ${{ steps.plan.outputs.hub_ref }}
      reason: ${{ steps.plan.outputs.reason }}
      attention: ${{ steps.plan.outputs.attention }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Check the planner
        run: python3 .github/scripts/test_nightly.py

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: python3 .github/scripts/nightly.py

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.build == 'true'
        with:
          name: nightly-notes
          path: notes/notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      channel: nightly
      ref: ${{ needs.plan.outputs.ref }}
      dry_run: ${{ inputs.dry_run || false }}
      hub_ref: ${{ needs.plan.outputs.hub_ref }}
    secrets: inherit

  # One issue while a night fails or leaves a hub bump out; closed by the
  # next good night. A dry run only reports in its summary.
  report:
    name: Report
    needs: [plan, build]
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Open, comment on or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          VERSION: ${{ needs.plan.outputs.version }}
          ATTENTION: ${{ needs.plan.outputs.attention }}
        run: |
          if [ "$PLAN" != success ] || [ "$BUILD" = failure ] || [ "$BUILD" = cancelled ]; then
            # Linux or Windows failing leaves the rest published: say which.
            fed=$(curl -fsSL "https://github.com/$RELEASES_REPO/releases/download/nightly/latest-nightly.json" | jq -r .version) || fed=
            if [ -n "$VERSION" ] && [ "$fed" = "$VERSION" ]; then
              platforms=$(curl -fsSL "https://github.com/$RELEASES_REPO/releases/download/nightly/latest-nightly.json" | jq -r '.platforms | keys | join(", ")')
              what="Nightly $VERSION was published for $platforms only: part of its build failed."
            else
              what="Nightly ${VERSION:-planning} didn't finish (planning $PLAN, build ${BUILD:-not started}) and wasn't published."
            fi
            [ -z "$ATTENTION" ] || what="$what $ATTENTION"
            .github/scripts/nightly-issue.sh failed "$what"
          elif [ -n "$ATTENTION" ]; then
            .github/scripts/nightly-issue.sh attention "$ATTENTION"
          else
            .github/scripts/nightly-issue.sh ok
          fi
