name: Release

# Builds Desk with its helper, hub (the commit in hub.ref) and memory store
# (vellev, the commit in vellev.ref) for each system:
#   - macOS: one universal Desk.app for Apple Silicon and Intel, every binary
#     signed with the Developer ID, the app and the disk image notarized and
#     stapled;
#   - Linux (x86_64): an AppImage, which updates itself, and a .deb;
# then publishes them with the signed updater artifacts (latest.json) as a
# GitHub release. See docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Where releases are published and where the app looks for updates. The
  # updater downloads without credentials, so this must be a repo people can
  # read: set the RELEASES_REPO variable to a public repo if this one is
  # private (RELEASES_TOKEN must then be able to write to it).
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  APP: desk/target/universal-apple-darwin/release/bundle/macos/Desk.app
  # sherpa-onnx's archives, kept out of target/ (see scripts/sherpa-onnx.sh).
  SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/sherpa-onnx

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="$INPUT"
          else
            v="${GITHUB_REF#refs/tags/v}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk

      - name: Read the hub ref
        id: hub
        run: echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"

      - name: Read the vellev ref
        id: vellev
        run: echo "ref=$(tr -d '[:space:]' < desk/vellev.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out vellev at vellev.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/vellev
          ref: ${{ steps.vellev.outputs.ref }}
          path: vellev
          # vellev is public; a token is only needed if it ever isn't.
          token: ${{ secrets.VELLEV_REPO_TOKEN || github.token }}

      # Beside Desk, under the name its package.json points at for the rich
      # renderers (file:../workforce-public-desk/packages/rich).
      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          # The hub repo is public; a token is only needed if it ever isn't.
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # vellev's ONNX Runtime for Intel Macs, built from source (ort ships
      # none): the slowest step on a cold cache, keyed by its pin.
      - name: Cache ONNX Runtime for Intel
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/desk-build/onnxruntime-x86_64
          key: onnxruntime-x86_64-${{ hashFiles('desk/scripts/onnxruntime-x86_64.sh') }}

      - name: Set the version
        working-directory: desk
        run: scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      # The hub is a large build: keep both workspaces' release builds,
      # keyed by the hub commit so a bump starts from the last cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desk -> target
            workforce-public-desk -> target
            vellev -> target
          key: hub-${{ steps.hub.outputs.ref }}-vellev-${{ steps.vellev.outputs.ref }}
          cache-on-failure: true

      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-universal

      # rust-cache restores target/sherpa-onnx-prebuilt without its libraries;
      # sherpa-onnx-sys's build script unpacks them again from the archives,
      # for each architecture the app is built for.
      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare --release aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build

      - name: Install Desk's packages
        working-directory: desk
        run: npm ci

      - name: Build the helper, hub and memory store (universal)
        working-directory: desk
        env:
          HUB_SOURCE: ${{ github.workspace }}/workforce-public-desk
          VELLEV_SOURCE: ${{ github.workspace }}/vellev
          MIN_FREE_GB: "12"
          # postgresql_embedded asks GitHub which Postgres builds exist; a
          # token keeps it under the API's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-sidecars.sh

      - name: Build Desk.app (universal)
        working-directory: desk
        env:
          ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
        run: |
          npx tauri build --target universal-apple-darwin --bundles app \
            --config "{\"plugins\":{\"updater\":{\"endpoints\":[\"$ENDPOINT\"]}}}"

      - name: Import the Developer ID certificate
        id: cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$pass" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "$pass" build.keychain
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" build.keychain >/dev/null
          rm certificate.p12
          identity=$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Inside out, each binary with only what it needs under the hardened
      # runtime: the helper and the memory store nothing, the hub JIT for its
      # WebAssembly skills, the app the microphone.
      - name: Sign
        working-directory: desk
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          app="${{ github.workspace }}/$APP"
          sign() { codesign --force --timestamp --options runtime --entitlements "src-tauri/entitlements/$1" --sign "$IDENTITY" "$2"; }
          sign Helper.entitlements "$app/Contents/MacOS/Desk Helper"
          sign Agents.entitlements "$app/Contents/MacOS/Desk Agents"
          sign Memory.entitlements "$app/Contents/MacOS/Desk Memory"
          sign Desk.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 60m
          rm notarize.zip
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Disk image
        id: dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p out dmg-root
          ditto "$APP" dmg-root/Desk.app
          ln -s /Applications dmg-root/Applications
          dmg="out/Desk_${VERSION}_universal.dmg"
          hdiutil create -volname Desk -srcfolder dmg-root -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 60m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      # The updater's download: the stapled app, signed with the updater key
      # whose public half is in tauri.conf.json.
      - name: Updater artifacts
        working-directory: desk
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          out="${{ github.workspace }}/out"
          tar -czf "$out/Desk.app.tar.gz" -C "$(dirname "${{ github.workspace }}/$APP")" Desk.app
          npx tauri signer sign "$out/Desk.app.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            ${{ steps.dmg.outputs.path }}
            out/Desk.app.tar.gz
            out/Desk.app.tar.gz.sig
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  linux-x86_64:
    needs: version
    # Built on the oldest Ubuntu Desk supports, so what it links (glibc 2.35)
    # is there on every newer one, and inside WSL.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk

      - name: Read the hub and vellev refs
        id: refs
        run: |
          echo "hub=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"
          echo "vellev=$(tr -d '[:space:]' < desk/vellev.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out vellev at vellev.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/vellev
          ref: ${{ steps.refs.outputs.vellev }}
          path: vellev
          token: ${{ secrets.VELLEV_REPO_TOKEN || github.token }}

      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.refs.outputs.hub }}
          path: workforce-public-desk
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libfuse2 pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Set the version
        working-directory: desk
        run: scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desk -> target
            workforce-public-desk -> target
            vellev -> target
          key: hub-${{ steps.refs.outputs.hub }}-vellev-${{ steps.refs.outputs.vellev }}
          cache-on-failure: true

      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-x86_64

      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare --release

      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build

      - name: Install Desk's packages
        working-directory: desk
        run: npm ci

      - name: Build the helper, hub and memory store
        working-directory: desk
        env:
          HUB_SOURCE: ${{ github.workspace }}/workforce-public-desk
          VELLEV_SOURCE: ${{ github.workspace }}/vellev
          MIN_FREE_GB: "12"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-sidecars.sh

      # The AppImage is the updater's download, signed with the updater key
      # (createUpdaterArtifacts in tauri.linux.conf.json); the .deb is updated
      # by the system's package manager.
      - name: Build the AppImage and the .deb
        working-directory: desk
        env:
          ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --bundles appimage,deb \
            --config "{\"plugins\":{\"updater\":{\"endpoints\":[\"$ENDPOINT\"]}}}"

      # What Desk on Windows installs inside WSL: the three programs, under
      # their Linux names, and Desk's Claude Code plugin.
      - name: Collect
        working-directory: desk
        run: |
          out="${{ github.workspace }}/out"
          mkdir -p "$out" backend-linux-x86_64
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig \
            target/release/bundle/deb/*.deb "$out/"
          for name in desk-helper desk-agents desk-memory; do
            cp "src-tauri/binaries/$name-x86_64-unknown-linux-gnu" "backend-linux-x86_64/$name"
          done
          cp -R src-tauri/resources/claude-plugin backend-linux-x86_64/claude-plugin
          ls -la "$out" backend-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: backend-linux-x86_64
          path: desk/backend-linux-x86_64/
          if-no-files-found: error

  publish:
    needs: [version, macos, linux-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{macos,linux-x86_64}"
          path: out
          merge-multiple: true

      # One latest.json for every system's updater: the universal app for
      # both Macs, the AppImage for Linux.
      - name: latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          base="https://github.com/$RELEASES_REPO/releases/download/v$VERSION"
          appimage=$(basename out/*.AppImage)
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "Desk $VERSION" \
            --arg mac "$base/Desk.app.tar.gz" --arg mac_sig "$(cat out/Desk.app.tar.gz.sig)" \
            --arg linux "$base/$appimage" --arg linux_sig "$(cat "out/$appimage.sig")" '{
              version: $v, notes: $notes, pub_date: $date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac },
                "darwin-x86_64": { signature: $mac_sig, url: $mac },
                "linux-x86_64": { signature: $linux_sig, url: $linux }
              }
            }' > out/latest.json
          jq '.platforms | keys' out/latest.json

      - name: Publish the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASES_REPO" --title "Desk $VERSION" \
              --notes "Desk $VERSION" --draft
          fi
          gh release upload "$tag" --repo "$RELEASES_REPO" --clobber out/*
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false --latest
