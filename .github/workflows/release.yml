name: Release

# Builds Desk with its helper, hub (the commit in hub.ref) and memory store
# (vellev, the commit in vellev.ref) for each system:
#   - macOS: one universal Desk.app for Apple Silicon and Intel, every binary
#     signed with the Developer ID, the app and the disk image notarized and
#     stapled;
#   - Linux (x86_64): an AppImage, which updates itself, and a .deb;
#   - Windows (x86_64): the per-user NSIS installer, which updates itself,
#     and an MSI for managed installs, carrying the Linux backend Desk
#     installs into WSL; Authenticode-signed only when WINDOWS_SIGNING is on;
#   - the Linux backend alone, for x86_64 and aarch64 (backend-build.yml),
#     for glibc 2.34 and newer: what Desk installs into WSL, and on machines
#     (Linux boxes Desk drives over SSH) as signed tarballs;
# then publishes them with the signed updater artifacts (latest.json) as a
# GitHub release. See docs/RELEASING.md.
#
# Nightly (nightly.yml) calls it with channel `nightly`: the same builds of
# the commit it names, published as a pre-release that is never the latest,
# with latest-nightly.json on the `nightly` release in place of latest.json.
# Nothing on that path writes latest.json or marks a release latest, so
# Stable's feed never offers a nightly.

on:
  push:
    tags:
      - "v*"
      # A tag with a pre-release part (a nightly's v0.2.11-nightly.…) never
      # starts a stable release.
      - "!v*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Build, sign and check everything, but publish nothing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version to build (a nightly's: 0.2.11-nightly.20261120.42)"
        required: true
        type: string
      channel:
        description: "stable or nightly"
        type: string
        default: stable
      ref:
        description: "The Desk commit to build"
        type: string
        default: ""
      dry_run:
        description: "Build and sign everything, publish nothing"
        type: boolean
        default: false
      hub_ref:
        description: "A dry run's hub commit in place of hub.ref's (the bump it would commit)"
        type: string
        default: ""

permissions:
  contents: write

# Stable releases one at a time, and a stable dry run never waits for or
# holds up one. A nightly has its own group, so it never takes the place of
# a stable release waiting for its turn; a nightly dry run, one of its own.
concurrency:
  group: ${{ inputs.channel == 'nightly' && (inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release-nightly') || format('release{0}', inputs.dry_run && '-dry-run' || '') }}
  cancel-in-progress: false

env:
  # Where releases are published and where the app looks for updates. The
  # updater downloads without credentials, so this must be a repo people can
  # read: set the RELEASES_REPO variable to a public repo if this one is
  # private (RELEASES_TOKEN must then be able to write to it).
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
  APP: desk/target/universal-apple-darwin/release/bundle/macos/Desk.app
  # sherpa-onnx's archives, kept out of target/ (see scripts/sherpa-onnx.sh).
  SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/sherpa-onnx

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      # The version given (Release's own form, or Nightly's call), else the
      # tag's. Stable takes a plain release version only; Nightly a
      # nightly's only, so neither can publish the other's.
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          HUB_REF: ${{ inputs.hub_ref }}
        run: |
          v="${INPUT:-${GITHUB_REF#refs/tags/}}"
          v="${v#v}"
          case "$CHANNEL" in
            stable)
              [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$v isn't a stable version (major.minor.patch)"; exit 1; } ;;
            nightly)
              [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[1-9][0-9]{7}\.[1-9][0-9]*$ ]] || { echo "::error::$v isn't a nightly version (0.2.11-nightly.20261120.42)"; exit 1; } ;;
            *)
              echo "::error::no channel $CHANNEL: stable or nightly"; exit 1 ;;
          esac
          if [ -n "$HUB_REF" ] && [ "$DRY_RUN" != true ]; then
            echo "::error::a hub ref other than hub.ref's is for a dry run only"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    # Two hub sidecar builds (one per arch, ~85 min each) and the app
    # build run one after another; 240 ran out on v0.2.10 as the bundle finished.
    timeout-minutes: 360
    steps:
      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk
          ref: ${{ inputs.ref }}

      - name: Read the hub ref
        id: hub
        env:
          HUB_OVERRIDE: ${{ inputs.hub_ref }}
        # A dry run's hub bump is written into the checkout's hub.ref, as the
        # commit it would make has it (build-sidecars.sh checks the two agree).
        run: |
          [ -z "$HUB_OVERRIDE" ] || echo "$HUB_OVERRIDE" > desk/hub.ref
          echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"

      - name: Read the vellev ref
        id: vellev
        run: echo "ref=$(tr -d '[:space:]' < desk/vellev.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out vellev at vellev.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/vellev
          ref: ${{ steps.vellev.outputs.ref }}
          path: vellev
          # vellev is public; a token is only needed if it ever isn't.
          token: ${{ secrets.VELLEV_REPO_TOKEN || github.token }}

      # Beside Desk, under the name its package.json points at for the rich
      # renderers (file:../workforce-public-desk/packages/rich).
      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          # The hub repo is public; a token is only needed if it ever isn't.
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set the version
        working-directory: desk
        run: scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      # The hub is a large build: keep both workspaces' release builds,
      # keyed by the hub commit so a bump starts from the last cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desk -> target
            workforce-public-desk -> target
            vellev -> target
          key: hub-${{ steps.hub.outputs.ref }}-vellev-${{ steps.vellev.outputs.ref }}
          cache-on-failure: true

      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-universal

      # rust-cache restores target/sherpa-onnx-prebuilt without its libraries;
      # sherpa-onnx-sys's build script unpacks them again from the archives,
      # for each architecture the app is built for.
      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare --release aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build

      - name: Install Desk's packages
        working-directory: desk
        run: npm ci

      - name: Build the helper, hub and memory store (universal)
        working-directory: desk
        env:
          HUB_SOURCE: ${{ github.workspace }}/workforce-public-desk
          VELLEV_SOURCE: ${{ github.workspace }}/vellev
          MIN_FREE_GB: "12"
          # postgresql_embedded asks GitHub which Postgres builds exist; a
          # token keeps it under the API's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-sidecars.sh

      - name: Build Desk.app (universal)
        working-directory: desk
        env:
          ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
        run: |
          npx tauri build --target universal-apple-darwin --bundles app \
            --config "{\"plugins\":{\"updater\":{\"endpoints\":[\"$ENDPOINT\"]}}}"

      # The app's Intel memory store is the pinned one (Desk 0.2.10's:
      # scripts/intel-memory.sh), checked before signing replaces its
      # signature.
      - name: Check the Intel memory store
        run: desk/scripts/intel-memory.sh check "$APP/Contents/MacOS/Desk Memory"

      - name: Import the Developer ID certificate
        id: cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$pass" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "$pass" build.keychain
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" build.keychain >/dev/null
          rm certificate.p12
          identity=$(security find-identity -v -p codesigning build.keychain \
            | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Inside out, each binary with only what it needs under the hardened
      # runtime: the helper and the memory store nothing, the hub JIT for its
      # WebAssembly skills, the app the microphone.
      - name: Sign
        working-directory: desk
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          app="${{ github.workspace }}/$APP"
          sign() { codesign --force --timestamp --options runtime --entitlements "src-tauri/entitlements/$1" --sign "$IDENTITY" "$2"; }
          sign Helper.entitlements "$app/Contents/MacOS/Desk Helper"
          sign Agents.entitlements "$app/Contents/MacOS/Desk Agents"
          sign Memory.entitlements "$app/Contents/MacOS/Desk Memory"
          sign Desk.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 60m
          rm notarize.zip
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Disk image
        id: dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p out dmg-root
          ditto "$APP" dmg-root/Desk.app
          ln -s /Applications dmg-root/Applications
          dmg="out/Desk_${VERSION}_universal.dmg"
          hdiutil create -volname Desk -srcfolder dmg-root -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 60m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      # The updater's download: the stapled app, signed with the updater key
      # whose public half is in tauri.conf.json.
      # Signed for its version, as tauri build signs the AppImage and the
      # installer: the app (requireSignedVersion) refuses a feed that
      # announces one version with another's download.
      - name: Updater artifacts
        working-directory: desk
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          out="${{ github.workspace }}/out"
          tar -czf "$out/Desk.app.tar.gz" -C "$(dirname "${{ github.workspace }}/$APP")" Desk.app
          npx tauri signer sign --app-version "$VERSION" "$out/Desk.app.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            ${{ steps.dmg.outputs.path }}
            out/Desk.app.tar.gz
            out/Desk.app.tar.gz.sig
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  linux-x86_64:
    needs: [version, backend]
    # Built on the oldest Ubuntu Desk supports, so what it links (glibc 2.35)
    # is there on every newer one, and inside WSL. Its helper, hub and memory
    # store are the Linux backend's (backend-build.yml: glibc 2.28, with the
    # ONNX Runtime, Postgres and OpenSSL built for it), not built again here,
    # where ort's own ONNX Runtime (glibc 2.38) and theseus-rs' Postgres
    # (glibc 2.36) wouldn't run.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk
          ref: ${{ inputs.ref }}

      - name: Read the hub ref
        id: hub
        env:
          HUB_OVERRIDE: ${{ inputs.hub_ref }}
        # A dry run's hub bump is written into the checkout's hub.ref, as the
        # commit it would make has it (build-sidecars.sh checks the two agree).
        run: |
          [ -z "$HUB_OVERRIDE" ] || echo "$HUB_OVERRIDE" > desk/hub.ref
          echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"

      # For the rich renderers.
      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libfuse2 pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Set the version
        working-directory: desk
        run: scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk -> target
          cache-on-failure: true

      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-x86_64

      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare --release

      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build

      - name: Install Desk's packages
        working-directory: desk
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: backend-linux-x86_64
          path: backend

      # Where Tauri looks for the sidecars (externalBin in
      # tauri.linux.conf.json), executable again: an artifact keeps no modes.
      # And the ONNX Runtime the memory store links, checked against its pin,
      # which both packages put in /usr/lib/Desk (bundle.linux there), where
      # its memory store looks for it. The AppImage's tooling (linuxdeploy)
      # finds it there and moves a copy to usr/lib, which it points the
      # programs at.
      - name: The helper, hub and memory store
        working-directory: desk
        run: |
          mkdir -p src-tauri/binaries
          for name in desk-helper desk-agents desk-memory; do
            install -m 755 "$GITHUB_WORKSPACE/backend/$name" "src-tauri/binaries/$name-x86_64-unknown-linux-gnu"
          done
          scripts/onnxruntime.sh check "$GITHUB_WORKSPACE/backend/libonnxruntime.so.1" x86_64
          install -m 644 "$GITHUB_WORKSPACE/backend/libonnxruntime.so.1" src-tauri/binaries/libonnxruntime.so.1
          ls -la src-tauri/binaries

      # The AppImage is the updater's download, signed with the updater key
      # (createUpdaterArtifacts in tauri.linux.conf.json); the .deb is updated
      # by the system's package manager. A nightly builds the AppImage alone:
      # dpkg would order 0.2.11-nightly.… after 0.2.11 (its "-" starts a
      # Debian revision), so the stable after it would look like a downgrade.
      - name: Build the AppImage and the .deb
        working-directory: desk
        env:
          BUNDLES: ${{ needs.version.outputs.channel == 'nightly' && 'appimage' || 'appimage,deb' }}
          ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --bundles "$BUNDLES" \
            --config "{\"plugins\":{\"updater\":{\"endpoints\":[\"$ENDPOINT\"]}}}"

      # Each package's memory store runs and loads the ONNX Runtime the
      # package holds, not one of the system's: the .deb's the pinned file
      # itself; the AppImage's the copy its tooling (linuxdeploy) moved into
      # usr/lib and stripped.
      - name: Check the packages' ONNX Runtime
        working-directory: desk
        run: |
          check() {
            root=$(cd "$1" && pwd) want=$2
            found=$(env -i ldd "$root/usr/bin/desk-memory" | awk '$1 == "libonnxruntime.so.1" { print $3 }')
            [ "$(realpath "$found")" = "$(realpath "$want")" ] ||
              { echo "$1's desk-memory loads '$found', not $want"; exit 1; }
            env -i "$root/usr/bin/desk-memory" --help >/dev/null
          }
          work=$(mktemp -d)
          # A nightly builds no .deb.
          if [ "${{ needs.version.outputs.channel }}" != nightly ]; then
            dpkg-deb -x target/release/bundle/deb/*.deb "$work/deb"
            scripts/onnxruntime.sh check "$work/deb/usr/lib/Desk/libonnxruntime.so.1" x86_64
            check "$work/deb" "$work/deb/usr/lib/Desk/libonnxruntime.so.1"
          fi
          appimage=$(realpath target/release/bundle/appimage/*.AppImage)
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          check "$work/squashfs-root" "$work/squashfs-root/usr/lib/libonnxruntime.so.1"
          rm -rf "$work"

      - name: Collect
        working-directory: desk
        run: |
          out="${{ github.workspace }}/out"
          mkdir -p "$out"
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig "$out/"
          if [ "${{ needs.version.outputs.channel }}" != nightly ]; then
            cp target/release/bundle/deb/*.deb "$out/"
          fi
          ls -la "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: out/
          if-no-files-found: error

  # The Linux backend alone, for x86_64 and aarch64: what Desk installs
  # inside WSL and on machines (backend-build.yml).
  backend:
    needs: version
    uses: ./.github/workflows/backend-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.ref }}
      hub_ref: ${{ inputs.hub_ref }}
    secrets:
      VELLEV_REPO_TOKEN: ${{ secrets.VELLEV_REPO_TOKEN }}
      HUB_REPO_TOKEN: ${{ secrets.HUB_REPO_TOKEN }}

  windows:
    needs: [version, backend]
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk
          ref: ${{ inputs.ref }}

      - name: Read the hub ref
        id: hub
        env:
          HUB_OVERRIDE: ${{ inputs.hub_ref }}
        # A dry run's hub bump is written into the checkout's hub.ref, as the
        # commit it would make has it (build-sidecars.sh checks the two agree).
        run: |
          [ -z "$HUB_OVERRIDE" ] || echo "$HUB_OVERRIDE" > desk/hub.ref
          echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Set the version
        working-directory: desk
        run: scripts/set-version.sh "${{ needs.version.outputs.version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desk -> target
          cache-on-failure: true

      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-x86_64

      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare --release

      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build

      - name: Install Desk's packages
        working-directory: desk
        run: npm ci

      # The Linux backend the installers carry, which Desk installs into WSL,
      # with the pinned ONNX Runtime.
      - uses: actions/download-artifact@v7
        with:
          name: backend-linux-x86_64
          path: desk/src-tauri/resources/backend/linux-x86_64

      - name: Check the backend's ONNX Runtime
        shell: bash
        run: desk/scripts/onnxruntime.sh check desk/src-tauri/resources/backend/linux-x86_64/libonnxruntime.so.1 x86_64

      - name: Build Desk Helper.exe
        working-directory: desk
        run: |
          cargo build --release --locked -p desk-wsl --bin desk-wsl-helper
          mkdir -p src-tauri/binaries
          cp target/release/desk-wsl-helper.exe "src-tauri/binaries/Desk Helper-x86_64-pc-windows-msvc.exe"

      # Authenticode through Azure Trusted Signing, when the WINDOWS_SIGNING
      # variable is on: the app, Desk Helper.exe and the installers. Off,
      # the builds are unsigned and SmartScreen warns on first run. A
      # nightly builds the NSIS installer alone: the MSI takes no version
      # with a pre-release part like a nightly's.
      - name: Build the installers
        working-directory: desk
        env:
          BUNDLES: ${{ needs.version.outputs.channel == 'nightly' && 'nsis' || 'nsis,msi' }}
          ENDPOINT: https://github.com/${{ env.RELEASES_REPO }}/releases/latest/download/latest.json
          SIGNING: ${{ vars.WINDOWS_SIGNING }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # One line: npx's Windows shim passes an argument only up to its
          # first newline, so jq's pretty-printed JSON would reach tauri as `{`.
          config=$(jq -cn --arg endpoint "$ENDPOINT" '{plugins: {updater: {endpoints: [$endpoint]}}}')
          if [ "$SIGNING" = true ]; then
            cargo install --locked trusted-signing-cli
            sign="trusted-signing-cli -e $TRUSTED_SIGNING_ENDPOINT -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d Desk %1"
            config=$(jq -c --arg sign "$sign" '.bundle.windows.signCommand = $sign' <<<"$config")
          fi
          npx tauri build --bundles "$BUNDLES" --config "$config"

      - name: Collect
        working-directory: desk
        run: |
          out="${{ github.workspace }}/out"
          mkdir -p "$out"
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig "$out/"
          if [ "${{ needs.version.outputs.channel }}" != nightly ]; then
            cp target/release/bundle/msi/*.msi "$out/"
          fi
          ls -la "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: out/
          if-no-files-found: error

  # The Mac app and the machines' backend must have built. The Linux and
  # Windows desktop apps go in when they built and are left out when they
  # didn't: a release isn't held back by them.
  publish:
    needs: [version, macos, linux-x86_64, windows, backend]
    if: >-
      always() && needs.version.result == 'success' &&
      needs.macos.result == 'success' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{macos,linux-x86_64,windows-x86_64}"
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: backend-linux-*
          path: backend

      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk
          ref: ${{ inputs.ref }}

      # Beside Desk, where package.json finds the rich renderers, so the
      # lockfile installs as it is (nothing here builds them).
      - name: Read the hub ref
        id: hub
        env:
          HUB_OVERRIDE: ${{ inputs.hub_ref }}
        # A dry run's hub bump is written into the checkout's hub.ref, as the
        # commit it would make has it (build-sidecars.sh checks the two agree).
        run: |
          [ -z "$HUB_OVERRIDE" ] || echo "$HUB_OVERRIDE" > desk/hub.ref
          echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            desk/package-lock.json
            workforce-public-desk/packages/rich/package-lock.json

      # The Tauri CLI that signs, at the version and checksum package-lock.json
      # pins.
      - name: Install Desk's packages
        working-directory: desk
        run: npm ci --ignore-scripts

      # The backend for machines: a tarball per architecture, with the
      # programs and the plugin at its top, signed with the updater key that
      # Desk checks it against before it copies it to a machine.
      - name: The machines' backends
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "no updater key to sign the backends with"; exit 1; }
          export TAURI="$GITHUB_WORKSPACE/desk/node_modules/.bin/tauri"
          for arch in x86_64 aarch64; do
            desk/scripts/backend-tarball.sh "backend/backend-linux-$arch" "$arch" "$VERSION" out
            test -s "out/desk-backend-linux-$arch-$VERSION.tar.gz.sig"
          done

      # One latest.json for every system's updater: the universal app for
      # both Macs, and the AppImage for Linux and the NSIS installer for
      # Windows when they were built. A nightly's is latest-nightly.json,
      # kept out of out/ (everything there goes on the version's own
      # release): it goes on the `nightly` release, with the Desk commit and
      # hub ref it was built from, for the next nightly to compare with.
      - name: latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          DESK_COMMIT: ${{ inputs.ref || github.sha }}
          HUB_REF: ${{ steps.hub.outputs.ref }}
        run: |
          base="https://github.com/$RELEASES_REPO/releases/download/v$VERSION"
          platforms=$(jq -n --arg mac "$base/Desk.app.tar.gz" --arg mac_sig "$(cat out/Desk.app.tar.gz.sig)" \
            '{"darwin-aarch64": {signature: $mac_sig, url: $mac}, "darwin-x86_64": {signature: $mac_sig, url: $mac}}')
          shopt -s nullglob
          for appimage in out/*.AppImage; do
            name=$(basename "$appimage")
            platforms=$(jq --arg url "$base/$name" --arg sig "$(cat "$appimage.sig")" \
              '. + {"linux-x86_64": {signature: $sig, url: $url}}' <<<"$platforms")
          done
          for setup in out/*-setup.exe; do
            name=$(basename "$setup")
            platforms=$(jq --arg url "$base/$name" --arg sig "$(cat "$setup.sig")" \
              '. + {"windows-x86_64": {signature: $sig, url: $url}}' <<<"$platforms")
          done
          if [ "$CHANNEL" = nightly ]; then
            mkdir -p feed
            jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "Desk $VERSION (nightly)" \
              --arg desk "$DESK_COMMIT" --arg hub "$HUB_REF" --argjson platforms "$platforms" \
              '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms, desk_commit: $desk, hub_ref: $hub}' \
              > feed/latest-nightly.json
            jq '.platforms | keys' feed/latest-nightly.json
          else
            jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg notes "Desk $VERSION" \
              --argjson platforms "$platforms" \
              '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms}' > out/latest.json
            jq '.platforms | keys' out/latest.json
          fi

      # Each download the feed names, checked as the app will check it:
      # against the updater key in tauri.conf.json, and signed for this
      # version (requireSignedVersion). A nightly never carries latest.json.
      - name: Check the feed's signatures
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          for try in 1 2 3; do
            sudo apt-get install -y minisign >/dev/null && break
            sudo apt-get update >/dev/null || true
            [ "$try" = 3 ] && exit 1
          done
          if [ "$CHANNEL" = nightly ]; then
            feed=feed/latest-nightly.json
            [ ! -e out/latest.json ] || { echo "::error::a nightly must never carry latest.json"; exit 1; }
          else
            feed=out/latest.json
          fi
          set -o pipefail
          # Both Macs always; Linux and Windows when they were built.
          want='["darwin-aarch64","darwin-x86_64"]'
          ls out/*.AppImage >/dev/null 2>&1 && want=$(jq -c '. + ["linux-x86_64"]' <<<"$want")
          ls out/*-setup.exe >/dev/null 2>&1 && want=$(jq -c '. + ["windows-x86_64"]' <<<"$want")
          jq -e --argjson want "$want" '(.platforms | keys) == ($want | sort)' "$feed" >/dev/null ||
            { echo "::error::the feed's platforms aren't $want"; exit 1; }
          jq -r '.plugins.updater.pubkey' desk/src-tauri/tauri.conf.json | base64 --decode > updater.pub
          jq -r '.platforms | to_entries[] | "\(.key) \(.value.url) \(.value.signature)"' "$feed" |
            while read -r platform url signature; do
              file="out/${url##*/}"
              [ "$url" = "https://github.com/$RELEASES_REPO/releases/download/v$VERSION/${url##*/}" ] ||
                { echo "::error::$platform's download isn't on v$VERSION's release: $url"; exit 1; }
              base64 --decode <<<"$signature" > check.sig
              minisign -Vq -p updater.pub -m "$file" -x check.sig
              sed -n 's/^trusted comment: //p' check.sig | tr '\t' '\n' | grep -qx "version:$VERSION" ||
                { echo "::error::$platform's $file isn't signed for $VERSION"; exit 1; }
              echo "$platform: $file signed for $VERSION"
            done
          rm -f updater.pub check.sig

      - name: Publish the release
        if: needs.version.outputs.channel == 'stable' && !inputs.dry_run
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASES_REPO" --title "Desk $VERSION" \
              --notes "Desk $VERSION" --draft
          fi
          gh release upload "$tag" --repo "$RELEASES_REPO" --clobber out/*
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false --latest

      # Nightly.yml's notes: the pull requests and hub commits since the
      # last nightly.
      - uses: actions/download-artifact@v7
        if: needs.version.outputs.channel == 'nightly'
        with:
          name: nightly-notes
          path: notes

      # A dry run keeps what it would publish as the run's artifact.
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.channel == 'nightly' && inputs.dry_run
        with:
          name: nightly-dry-run
          path: |
            feed/latest-nightly.json
            notes/notes.md
          if-no-files-found: error

      # Its own pre-release first, never the latest, so the feed never names
      # a download that isn't there yet; then the feed. The tag points at
      # the commit built when the releases are kept in this repo.
      - name: Publish the nightly
        if: needs.version.outputs.channel == 'nightly' && !inputs.dry_run
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DESK_COMMIT: ${{ inputs.ref || github.sha }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          tag="v$VERSION"
          target=()
          [ "$RELEASES_REPO" != "$GITHUB_REPOSITORY" ] || target=(--target "$DESK_COMMIT")
          if ! gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASES_REPO" --title "Desk $VERSION (nightly)" \
              --notes-file notes/notes.md --prerelease --latest=false --draft "${target[@]}"
          fi
          gh release upload "$tag" --repo "$RELEASES_REPO" --clobber out/*
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false --prerelease --latest=false
          if ! gh release view nightly --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create nightly --repo "$RELEASES_REPO" --title "Desk nightly" --prerelease --latest=false \
              --notes "Where Desk set to Nightly looks for updates (latest-nightly.json). Each nightly is its own pre-release." \
              "${target[@]}"
          fi
          gh release upload nightly --repo "$RELEASES_REPO" --clobber feed/latest-nightly.json

      # Stable's feed is as it was: its latest release is no nightly, and
      # the nightly feed offers this version.
      - name: Check both feeds
        if: needs.version.outputs.channel == 'nightly' && !inputs.dry_run
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          latest=$(gh release view --repo "$RELEASES_REPO" --json tagName,isPrerelease --jq '"\(.tagName) \(.isPrerelease)"')
          case "$latest" in
            *-*|*true) echo "::error::Stable's latest release is now $latest: make the last stable the latest again"; exit 1 ;;
          esac
          for _ in 1 2 3 4 5; do
            got=$(curl -fsSL "https://github.com/$RELEASES_REPO/releases/download/nightly/latest-nightly.json" | jq -r .version) || got=
            [ "$got" = "$VERSION" ] && break
            sleep 20
          done
          [ "$got" = "$VERSION" ] || { echo "::error::the nightly feed says ${got:-nothing}, not $VERSION"; exit 1; }
          echo "Stable's latest is $latest; the nightly feed offers $VERSION."

      # A nightly goes once a stable as new as it is out (a Desk on it moves
      # to that stable, even on Stable) and 14 newer nightlies follow it.
      # Until then it stays, with its machines' backend, for a Desk still on it.
      - name: Prune old nightlies
        if: needs.version.outputs.channel == 'nightly' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          set -o pipefail
          releases=$(gh release list --repo "$RELEASES_REPO" --limit 1000 --json tagName,isPrerelease,isDraft,createdAt)
          stable=$(jq -r '[.[] | select((.isPrerelease | not) and (.isDraft | not)) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")] | .[]' <<<"$releases" | sort -V | tail -1)
          [ -n "$stable" ] || exit 0
          jq -r '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")))] | sort_by(.createdAt) | reverse | .[14:] | .[].tagName' <<<"$releases" |
            while read -r tag; do
              base=${tag#v}
              base=${base%%-*}
              # Superseded: its own stable (or a later one) is out.
              [ "$(printf '%s\n%s\n' "$base" "$stable" | sort -V | tail -1)" = "$stable" ] || continue
              gh release delete "$tag" --repo "$RELEASES_REPO" --cleanup-tag --yes || echo "::warning::couldn't remove $tag"
            done
