name: Linux backend build

# The Linux backend alone — Desk Helper, the hub at hub.ref and the memory
# store at vellev.ref, under their Linux names, with Desk's Claude Code
# plugin — in release mode, for x86_64 and aarch64, each on its own
# architecture's runner. What Desk installs inside WSL and on machines
# (Linux boxes Desk drives over SSH), so it is built to run on as many
# distributions as it can:
#   - inside manylinux_2_28 (AlmaLinux 8), so Desk's own programs need only
#     glibc 2.28;
#   - with OpenSSL linked in, so they need no libssl of the distribution's;
#   - with ONNX Runtime built here, since ort's own needs glibc 2.38;
#   - with the Postgres the helper embeds built here too
#     (scripts/postgres-linux.sh), since theseus-rs' builds, which
#     postgresql_embedded downloads otherwise, need glibc 2.36.
# Desk says the backend runs on glibc 2.34 and newer (MIN_GLIBC in
# crates/desk-core/src/backend.rs): Ubuntu 22.04, Debian 12, RHEL/Rocky/Alma
# 9, Amazon Linux 2023, Fedora. Each build then runs scripts/backend-smoke.sh
# on those, starting Postgres and the hub.
#
# The release calls it (release.yml, with the version to stamp); a pull
# request runs it when what it is built with changes. It publishes nothing.

on:
  workflow_call:
    inputs:
      version:
        description: "The version to stamp into the build; empty leaves the repo's"
        type: string
        default: ""
    secrets:
      VELLEV_REPO_TOKEN:
        required: false
      HUB_REPO_TOKEN:
        required: false
  pull_request:
    paths:
      - scripts/build-sidecars.sh
      - scripts/onnxruntime.sh
      - scripts/openssl-static.sh
      - scripts/postgres-linux.sh
      - scripts/backend-tarball.sh
      - scripts/backend-smoke.sh
      - .cargo/config.toml
      - .github/workflows/backend-build.yml

permissions:
  contents: read

concurrency:
  group: backend-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.25-1@sha256:e2808351a165aa85913d79f1f8457b4f6d74047b47fba07b5b9a5e6c0055a017
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.25-1@sha256:743e05864cdd8dc63dbf568898abd7ff616d121440770fda36263294c6f711c6
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 300
    steps:
      # Perl for building OpenSSL, and bison and flex for Postgres, on top of
      # the image's compilers, cmake, git, patchelf and Python. Again when a
      # mirror hands back empty metadata, as AlmaLinux's sometimes do.
      - name: Build tools
        run: |
          for try in 1 2 3; do
            dnf install -y perl-core which bison flex && exit 0
            dnf clean metadata
            sleep 20
          done
          exit 1

      - name: Check out Desk
        uses: actions/checkout@v7
        with:
          path: desk

      - name: Read the hub and vellev refs
        id: refs
        run: |
          echo "hub=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"
          echo "vellev=$(tr -d '[:space:]' < desk/vellev.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out vellev at vellev.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/vellev
          ref: ${{ steps.refs.outputs.vellev }}
          path: vellev
          token: ${{ secrets.VELLEV_REPO_TOKEN || github.token }}

      - name: Check out the hub at hub.ref
        uses: actions/checkout@v7
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.refs.outputs.hub }}
          path: workforce-public-desk
          token: ${{ secrets.HUB_REPO_TOKEN || github.token }}

      # The checkouts belong to the runner's user, not the container's root.
      - name: Let git read the checkouts
        run: git config --global --add safe.directory '*'

      - uses: dtolnay/rust-toolchain@stable

      - name: Set the version
        if: inputs.version != ''
        working-directory: desk
        run: scripts/set-version.sh "${{ inputs.version }}"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desk -> target
            workforce-public-desk -> target
            vellev -> target
          key: backend-${{ matrix.arch }}-hub-${{ steps.refs.outputs.hub }}-vellev-${{ steps.refs.outputs.vellev }}
          cache-on-failure: true

      # The slowest step on a cold cache, keyed by its pin, and kept as soon
      # as it is built, whatever the build after it does.
      - name: Restore ONNX Runtime
        id: ort
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/onnxruntime
          key: onnxruntime-linux-${{ matrix.arch }}-${{ hashFiles('desk/scripts/onnxruntime.sh') }}

      - name: ONNX Runtime
        id: ort-build
        run: desk/scripts/onnxruntime.sh "$GITHUB_WORKSPACE/onnxruntime"

      # Only a finished build: one cut short would be restored as if it were.
      - name: Keep ONNX Runtime
        if: always() && steps.ort.outputs.cache-hit != 'true' && steps.ort-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/onnxruntime
          key: onnxruntime-linux-${{ matrix.arch }}-${{ hashFiles('desk/scripts/onnxruntime.sh') }}

      - name: OpenSSL (static)
        run: desk/scripts/openssl-static.sh "$RUNNER_TEMP/openssl"

      # Postgres for the helper to embed, keyed by its pin like ONNX Runtime.
      # A restored one is checked again (its checksum, and that it needs
      # glibc MIN_GLIBC at most) before it's used.
      - name: Restore Postgres
        id: pg
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/postgres
          key: postgres-linux-${{ matrix.arch }}-${{ hashFiles('desk/scripts/postgres-linux.sh', 'desk/.cargo/config.toml') }}

      - name: Postgres
        id: pg-build
        run: |
          desk/scripts/postgres-linux.sh "$GITHUB_WORKSPACE/postgres"
          archive=$(ls "$GITHUB_WORKSPACE"/postgres/postgresql-*-${{ matrix.arch }}-unknown-linux-gnu.tar.gz)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          {
            echo "### Postgres (${{ matrix.arch }})"
            echo '```'
            cat "$archive.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Postgres
        if: always() && steps.pg.outputs.cache-hit != 'true' && steps.pg-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/postgres
          key: postgres-linux-${{ matrix.arch }}-${{ hashFiles('desk/scripts/postgres-linux.sh', 'desk/.cargo/config.toml') }}

      # The archive and its checksum, beside the backend: what the helper
      # embeds.
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-linux-${{ matrix.arch }}
          path: ${{ github.workspace }}/postgres/
          if-no-files-found: error

      - name: Build the helper, hub and memory store
        working-directory: desk
        env:
          HUB_SOURCE: ${{ github.workspace }}/workforce-public-desk
          VELLEV_SOURCE: ${{ github.workspace }}/vellev
          MIN_FREE_GB: "12"
          GITHUB_TOKEN: ${{ github.token }}
          OPENSSL_STATIC: "1"
          ORT_FROM_SOURCE: "1"
          ORT_DIR: ${{ github.workspace }}/onnxruntime
          POSTGRES_ARCHIVE: ${{ steps.pg-build.outputs.archive }}
        run: OPENSSL_DIR="$RUNNER_TEMP/openssl" scripts/build-sidecars.sh

      - name: Collect
        working-directory: desk
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          dir="backend-linux-$ARCH"
          mkdir -p "$dir"
          for name in desk-helper desk-agents desk-memory; do
            cp "src-tauri/binaries/$name-$ARCH-unknown-linux-gnu" "$dir/$name"
          done
          cp -R src-tauri/resources/claude-plugin "$dir/claude-plugin"
          # Nothing newer than the image's glibc, and no libssl.
          for name in desk-helper desk-agents desk-memory; do
            newest=$(objdump -T "$dir/$name" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$name needs $newest"
            [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] ||
              { echo "$name needs a glibc newer than 2.28"; exit 1; }
            if ldd "$dir/$name" | grep -E 'libssl|libcrypto'; then
              echo "$name links the system's OpenSSL"
              exit 1
            fi
          done
          ls -la "$dir"

      # With hidden files: the plugin's manifest is claude-plugin/.claude-plugin/,
      # which the upload leaves out otherwise.
      - uses: actions/upload-artifact@v7
        with:
          name: backend-linux-${{ matrix.arch }}
          path: desk/backend-linux-${{ matrix.arch }}/
          include-hidden-files: true
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.arch }}, ${{ matrix.distro }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # The oldest each family Desk supports, and the newest.
        distro:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "rockylinux/rockylinux:9"
          - "amazonlinux:2023"
          - "fedora:42"
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    # With an init that reaps what the helper leaves, so a PTY holder that
    # was ended isn't still seen as a zombie.
    container:
      image: ${{ matrix.distro }}
      options: --init
    timeout-minutes: 30
    steps:
      # What the smoke test uses, and a normal user to run it as: Postgres
      # won't run as root.
      - name: Tools and a user
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y --allowerasing curl jq procps-ng tar gzip findutils shadow-utils util-linux
          else
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl jq procps ca-certificates
          fi
          useradd -m smoke

      - uses: actions/checkout@v7
        with:
          path: desk

      - uses: actions/download-artifact@v7
        with:
          name: backend-linux-${{ matrix.arch }}
          path: backend

      - name: Smoke test
        run: |
          chmod 755 backend/desk-helper backend/desk-agents backend/desk-memory
          cp -R backend /home/smoke/backend
          cp desk/scripts/backend-smoke.sh /home/smoke/backend-smoke.sh
          chown -R smoke /home/smoke
          su smoke -c 'cd ~ && bash ~/backend-smoke.sh ~/backend'
