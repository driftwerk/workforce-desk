name: Dev install

# Builds Desk Helper (`desk-hubd`, with the dev-overrides feature) for Apple
# Silicon Macs from every commit on main, so a developer's Mac can download it
# (~/bin/desk-fetch.sh) instead of compiling it. The binary is unsigned:
# whoever downloads it signs it. It is a workflow artifact, kept for 14 days,
# named with the full commit sha:
#   desk-hubd-aarch64-apple-darwin-<sha>   holding desk-hubd-<sha7>, its
#   .sha256 and COMMIT (the sha it was built from).
# The dev-overrides build lets `--workforce` and `--memory` choose the programs
# the helper starts, which are handed the hub's secrets: this is for a
# developer's own machine, never a release (release.yml is the release).
# Nothing here deploys, publishes or uses a secret. A pull request that
# changes only this file runs it too, to prove an edit builds; it can't write
# anything but its own artifact.

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/dev-install.yml]
  workflow_dispatch:

concurrency:
  group: dev-install-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build Desk Helper for macOS (arm64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # Its own cache key; only main saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev-install
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the helper
        env:
          # postgresql_embedded asks GitHub which Postgres builds exist; a
          # token keeps it under the API's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --locked -p desk-hubd --features dev-overrides
      - name: Package
        run: |
          set -euo pipefail
          short=${SHA:0:7}
          mkdir -p out
          cp target/release/desk-hubd "out/desk-hubd-$short"
          (cd out && shasum -a 256 "desk-hubd-$short" > "desk-hubd-$short.sha256")
          echo "$SHA" > out/COMMIT
          file "out/desk-hubd-$short"
          cat "out/desk-hubd-$short.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desk-hubd-aarch64-apple-darwin-${{ env.SHA }}
          path: out/
          retention-days: 14
          overwrite: true
          if-no-files-found: error
