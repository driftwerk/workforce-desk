name: CI

# Every pull request and push to main: secrets, dependency licences, and the
# app's format, lint, type and test checks. Desk builds against the hub
# commit in hub.ref (its rich renderers come from the hub's packages/rich).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE=${RANGE#*..} ;; esac
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$RANGE" .

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses

  check:
    name: Format, lint, types and tests
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The embedded-Postgres build script calls the GitHub API; the job's own
      # read-only token keeps it off the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
      # sherpa-onnx's archives, kept out of target/ (see scripts/sherpa-onnx.sh).
      SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/sherpa-onnx
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: desk
          persist-credentials: false
      - name: Read the hub ref
        id: hub
        run: echo "ref=$(tr -d '[:space:]' < desk/hub.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: driftwerk/workforce
          ref: ${{ steps.hub.outputs.ref }}
          path: workforce-public-desk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read the sherpa-onnx version
        id: sherpa
        run: echo "version=$(desk/scripts/sherpa-onnx.sh version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHERPA_ONNX_ARCHIVE_DIR }}
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # rust-cache restores target/sherpa-onnx-prebuilt without its libraries;
      # sherpa-onnx-sys's build script unpacks them again from the archives.
      - name: Speech libraries
        working-directory: desk
        run: scripts/sherpa-onnx.sh prepare
      - name: Build the rich renderers
        working-directory: workforce-public-desk/packages/rich
        run: npm ci && npm run build
      - name: Install
        working-directory: desk
        run: npm ci
      - name: Types and frontend tests
        working-directory: desk
        run: npx tsc --noEmit && npx vitest run
      # The app bundles the helper, the hub and its memory store as sidecars;
      # checks only need the files to exist (release builds them for real).
      - name: Placeholder sidecars
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p desk/src-tauri/binaries
          cd desk/src-tauri/binaries
          touch "Desk Helper-$triple" "Desk Agents-$triple" "Desk Memory-$triple"
          chmod +x "Desk Helper-$triple" "Desk Agents-$triple" "Desk Memory-$triple"
      - name: Format
        working-directory: desk
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: desk
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        working-directory: desk
        run: cargo test --workspace
